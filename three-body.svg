<svg width="800" height="360" viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="360" fill="url(#bg)"/>

  <!-- faint stars -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="40" cy="30" r="1"/>
    <circle cx="120" cy="330" r="1.2"/>
    <circle cx="740" cy="40" r="1"/>
    <circle cx="760" cy="300" r="1.3"/>
    <circle cx="300" cy="20" r="1"/>
    <circle cx="640" cy="330" r="1"/>
    <circle cx="60" cy="200" r="1"/>
    <circle cx="720" cy="150" r="1"/>
  </g>

  <!-- CR3BP-inspired composition: nested, offset orbit rings (outer body / inner
       secondary / a small libration loop around it), rendered as thin line-art
       rings — same nested-circle motif, recolored -->
  <g transform="translate(400,180)" fill="none">

    <!-- outer ring: primary's orbit about the barycenter -->
    <circle cx="0" cy="0" r="148" stroke="#58a6ff" stroke-width="2.5" opacity="0.85"/>

    <!-- middle ring: secondary body's orbit, offset like the reference mark -->
    <circle cx="-58" cy="22" r="90" stroke="#f778ba" stroke-width="2.5" opacity="0.85"/>

    <!-- inner ring: small body librating tightly around the secondary (L-point loop) -->
    <circle cx="-20" cy="29" r="35" stroke="#ffd33d" stroke-width="2.5" opacity="0.9"/>

    <!-- the three bodies, each riding its own ring -->
    <g filter="url(#glow)">
      <circle r="6" fill="#58a6ff">
        <animateMotion dur="10s" repeatCount="indefinite"
          path="M 148,0 A 148,148 0 1,1 -148,0 A 148,148 0 1,1 148,0"/>
      </circle>
      <circle r="5" fill="#f778ba">
        <animateMotion dur="5.5s" repeatCount="indefinite"
          path="M 32,22 A 90,90 0 1,1 -148,22 A 90,90 0 1,1 32,22"/>
      </circle>
      <circle r="3.5" fill="#ffd33d">
        <animateMotion dur="2.1s" repeatCount="indefinite"
          path="M 15,29 A 35,35 0 1,1 -55,29 A 35,35 0 1,1 15,29"/>
      </circle>
    </g>
  </g>
</svg>
